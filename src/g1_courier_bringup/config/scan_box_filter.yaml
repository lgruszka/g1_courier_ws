# Wycięcie bryły niesionej paczki ze skanu 2D — zastępuje parcel_cloud_filter (3D).
#
# Dlaczego 2D zamiast 3D: jedynym odbiorcą filtrowanej chmury był
# pointcloud_to_laserscan, którego produktem i tak jest scan ~722 wiązek. Filtr
# laser_filters/LaserScanBoxFilter (C++) tnie te ~722 wiązki zamiast ~20 tys.
# punktów chmury w Pythonie co ramkę — i usuwa jeden hop DDS pełnej chmury.
#
# box_frame=base_link, przód=+x. Box WĄSKI w Y (±0.25 m): krawędź stołu (szeroka)
# przetrwa po bokach, więc dokowanie LIDAR_LINE dalej działa. Wartości 1:1 z
# poprzedniego cropboxa 3D (parcel_cloud_filter, commit c66e407).
#
# invert: false => usuwa punkty WEWNĄTRZ boxa (bryła paczki). true => odwrotnie.
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: parcel_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: 0.10
        max_x: 0.45
        min_y: -0.25
        max_y: 0.25
        min_z: -1.0
        max_z: 1.0
        invert: false
