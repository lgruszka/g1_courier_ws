pointcloud_to_laserscan:
  ros__parameters:
    target_frame: livox_frame      # keep native frame; avoid runtime transform dependency in converter
    transform_tolerance: 2.0
    queue_size: 40                 # absorb short TF jitter without dropping input clouds
    min_height: -10.0              # keep full slice around lidar; narrow band can starve /scan
    max_height: 10.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087        # 0.5 deg
    scan_time: 0.1
    range_min: 0.20
    range_max: 25.0
    use_inf: true
