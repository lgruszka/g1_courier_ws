pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link        # frame the synthetic 2D scan is expressed in
    transform_tolerance: 0.05
    min_height: 0.10               # filter floor
    max_height: 0.80               # below shoulders so torso doesn't echo
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087        # 0.5 deg
    scan_time: 0.1
    range_min: 0.20
    range_max: 25.0
    use_inf: true
