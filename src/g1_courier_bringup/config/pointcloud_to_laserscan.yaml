pointcloud_to_laserscan:
  ros__parameters:
    target_frame: livox_frame
    transform_tolerance: 2.0
    queue_size: 40
    min_height: -1.65
    max_height: 0.7
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.2
    range_max: 25.0
    use_inf: true
