apriltag_node:
  ros__parameters:
    family: 36h11
    size: 0.16              # TODO_TUNE: physical tag side length [m]
    max_hamming: 0
    z_up: false
    profile: false
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
    tag:
      ids: [5, 7]           # table_a -> 5, table_b -> 7
      frames: [tag_a, tag_b]
      sizes: [0.16, 0.16]
