apriltag_node:
  ros__parameters:
    family: 16h5
    size: 0.10              # box tag physical side length [m] — only tag in system
    max_hamming: 0
    z_up: false
    profile: false
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
    tag:
      ids: [10]             # box (cardboard parcel) — the only AprilTag we use
      frames: [tag_box]
      sizes: [0.08]
