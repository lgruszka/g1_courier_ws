dock_action_server:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_dock
    apriltag_topic: /detections
    # realsense2_camera (real.launch.py, namespace camera + name camera).
    # Bylo /camera_info — po wymianie d435i_node na realsense (8c7b813) nikt
    # tam nie publikowal i dock jechal na fallbackowych intrinsics z sima
    # (fx=415.69 vs realne ~617 => ~33% blad skali odleglosci).
    camera_info_topic: /camera/camera/color/camera_info
    scan_topic: /scan
    control_rate_hz: 20.0
    settle_samples: 5

    apriltag.kp_xy: 0.3       # was 0.6 — softer lateral corrections to reduce
                               # PnP-noise-driven oscillation during dock servo.
                               # Forward cmd already saturated at max_vx=0.05 most
                               # of approach, so lower kp affects mainly fine
                               # final alignment (smoother decel, less overshoot).
    apriltag.kp_yaw: 1.2
    apriltag.max_vx: 0.05         # was 0.15 — bumped down to fix overshoot at convergence.
                                   # Detection→PnP→cmd round-trip latency ~100-150 ms.
                                   # At 0.15 m/s that's 15 mm per tick of stale dx, accumulates
                                   # to ~16 cm overshoot at z_c=0.33 target. 0.05 m/s → ~5 mm/tick
                                   # → ~5 cm overshoot, within loosened xy_tolerance.
    apriltag.max_vy: 0.10    # default — tested working in iter_1 with 8/16 stages OK
    apriltag.max_vyaw: 0.4    # active — needed for real robot where box may
                               # land at non-zero yaw. Sim noise (PnP IPPE flip
                               # ±0.6 rad) is filtered by yaw_deadband_rad below.
    apriltag.yaw_deadband_rad: 0.10   # ~5.7° — ignore dyaw smaller than this.
                                       # Suppresses PnP/IPPE noise without losing
                                       # the ability to correct genuine rotation
                                       # (real box placed at angle).
    apriltag.target_distance_m: 0.17       # box tag10 — palm-press alignment distance.
                                            # mission BT can override per-call via
                                            # target_pose.pose.position.z if needed.
    apriltag.tag_size_m: 0.10              # box tag10 physical edge length (10 cm)
    # Fallback pinhole intrinsics used until mac side starts publishing
    # rt/camera_info. Values match the mac head_cam (fovy=60°, 640x480):
    # fx = fy = (H/2) / tan(fovy/2) = 240 / tan(30°) ≈ 415.69, cx=W/2, cy=H/2.
    # Set apriltag.fx <= 0 to disable the fallback and require CameraInfo.
    apriltag.fx: 415.69
    apriltag.fy: 415.69
    apriltag.cx: 320.0
    apriltag.cy: 240.0

    lidar.target_distance_m: 0.30          # used only for transfer (place) phase — head_cam
                                            # occluded by carried box, so RANSAC line fit
                                            # against table edge instead of APRILTAG.
    lidar.range_min_m: 0.05                # must be < target_distance_m, otherwise RANSAC
                                            # filters out table edge when robot is too close
    lidar.range_max_m: 2.5
    lidar.kp_xy: 0.6
    lidar.kp_yaw: 1.0
    lidar.max_vx: 0.12
    lidar.max_vyaw: 0.3
