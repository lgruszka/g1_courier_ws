    cmd_vel_topic: /cmd_vel_dock
    apriltag_topic: /detections
    scan_topic: /scan
    control_rate_hz: 20.0
    settle_samples: 5

    apriltag.kp_xy: 0.6
    apriltag.kp_yaw: 1.2
    apriltag.max_vx: 0.15
