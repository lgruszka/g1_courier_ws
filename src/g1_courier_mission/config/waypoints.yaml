tables:
  # NOTE: predock_x is the world-frame target where kinematic_nav stops; the
  # dock servo then converges from there to target_distance_m (0.55) from
  # the tag. mac scene puts table centres at x={1.5, 4.0} and the tag plates
  # on the front face — measured tag world-x via PnP is ~{1.24, 3.74}, so
  # predock at ~0.74 m before the tag leaves dock servo a comfortable
  # ~0.2 m margin and keeps the tag inside head_cam FoV.
  table_a:
    apriltag_id: 5
    predock_x: 0.50
    predock_y: 0.00
    predock_yaw: 0.00    # facing the table
    dock_mode: apriltag
    final_xy_tol_m: 0.03
    final_yaw_tol_rad: 0.05

  table_b:
    apriltag_id: 7
    predock_x: 3.00
    predock_y: 0.00
    predock_yaw: 0.00
    # head_cam is occluded by the carried parcel during transfer to B,
    # so dock B uses the rear-LiDAR-style scan (real rt/scan from mac
    # mj_ray() array, Faza 1.2). LidarLineAligner runs RANSAC on the
    # 360-ray scan to fit the front edge of table B and aligns
    # perpendicular at target_distance_m.
    dock_mode: lidar_line
    final_xy_tol_m: 0.06    # looser than apriltag — line fit has more noise
    final_yaw_tol_rad: 0.07
